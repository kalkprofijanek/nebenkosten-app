packages:
  - apps/*
  - packages/*

sharedWorkspaceLockfile: true

# Security floors: GHSA-mh99-v99m-4gvg, GHSA-r28c-9q8g-f849,
# GHSA-rgw5-rvv9-x895, GHSA-fxqj-rqcc-2cmp and GHSA-2v37-7h3g-55p8.
# Remove once every upstream dependency requires a patched version itself.
overrides:
  # GHSA-q2hr-2g5m-vwhr and nested-brace recursion fixes.
  brace-expansion: '>=5.0.12 <6'
  # Undici WebSocket, retry, cache and TLS fixes (8.10.2).
  'undici@>=8.0.0 <8.10.2': '8.10.2'
  # GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g (Babel tooling).
  browserslist: '>=4.28.7 <5'
  nanoid: '3.3.18'
  postcss: '>=8.5.23'
  # GHSA-68fv-2mgg-jv7q (source-map-js event-loop DoS).
  source-map-js: '>=1.2.2'
