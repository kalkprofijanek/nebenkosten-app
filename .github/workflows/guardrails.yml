name: Repository Guardrails

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Protect legacy baseline in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- legacy/index.html

      - name: Run tests and repository guard
        run: npm run ci
