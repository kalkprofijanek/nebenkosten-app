name: Security Scans

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull Requests scheitern nur an neuen Funden gegenüber dem Basis-Commit;
  # auf main werden alle Funde an GitHub Code Scanning gemeldet.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan new findings in pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          semgrep scan
          --metrics=off
          --config p/default
          --config p/typescript
          --config p/react
          --config p/github-actions
          --baseline-commit "$BASE_SHA"
          --error
      - name: Scan repository
        if: github.event_name != 'pull_request'
        run: >-
          semgrep scan
          --metrics=off
          --config p/default
          --config p/typescript
          --config p/react
          --config p/github-actions
          --sarif-output=semgrep.sarif
      - name: Upload SARIF to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Ergänzt pnpm audit um die OSV-Datenbank; Pull Requests scheitern nur an
  # neu eingeführten Schwachstellen.
  osv-scanner-pr:
    name: osv-scanner
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=./pnpm-lock.yaml
      upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  osv-scanner:
    name: osv-scanner
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=./pnpm-lock.yaml
