name: Setup workspace
description: Activates the pinned Node.js and pnpm toolchain and installs the lockfile.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.1
    - name: Activate pnpm
      shell: bash
      # Ohne Argument aktiviert corepack die Angabe aus package.json
      # (packageManager mit sha512) und prüft den Download gegen den Hash.
      run: corepack enable && corepack prepare --activate
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
